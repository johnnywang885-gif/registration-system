<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>區會報名系統</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title-row">
        <img src="/images/culroc-logo.jpg" alt="CULROC Logo" class="header-logo">
        <div class="header-text">
          <h1>區會報名系統</h1>
          <p>請選擇身分並登入</p>
        </div>
        <span class="header-logo-spacer" aria-hidden="true"></span>
      </div>
    </div>

    <div class="nav">
      <a href="/" class="active">登入</a>
      <a href="/summary">目前報名統計</a>
      <a href="/intro.html">報名系統簡介</a>
    </div>

    <div class="card" style="max-width: 400px; margin: 0 auto;">
      <form id="loginForm">
        <div class="form-group">
          <label>帳號</label>
          <input type="text" id="clubId" placeholder="請輸入社號或 admin" required autofocus>
        </div>
        <div class="form-group">
          <label>密碼</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="請輸入密碼" required>
            <button type="button" class="password-toggle" aria-label="顯示密碼" title="顯示密碼" onclick="togglePassword('password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div id="errorMsg" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%;">登入</button>
      </form>
    </div>

    <div class="card" id="rulesCard" style="max-width: 680px; margin: 0 auto;">
      <h2 class="mb-20" style="font-size:18px; color:#4a3728;">報名規則</h2>
      <div id="rulesContent"><p style="color:#b5a898;">載入中...</p></div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      window.location.href = isAdmin ? '/admin' : '/register';
    }

    const EYE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const EYE_OFF_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF_SVG : EYE_SVG;
      btn.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
      btn.title = show ? '隱藏密碼' : '顯示密碼';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const clubId = document.getElementById('clubId').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      if (loginBtn.disabled) return;
      loginBtn.disabled = true;
      loginBtn.textContent = '登入中...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clubId, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error;
          errorMsg.classList.remove('hidden');
          loginBtn.disabled = false;
          loginBtn.textContent = '登入';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('clubId', data.clubId);
        localStorage.setItem('clubName', data.clubName);
        localStorage.setItem('isAdmin', data.isAdmin);
        localStorage.setItem('isSuperAdmin', data.isSuperAdmin === true);
        localStorage.setItem('adminPerms', JSON.stringify(data.adminPerms || []));

        window.location.href = data.isAdmin ? '/admin' : '/register';
      } catch (err) {
        errorMsg.textContent = '連線失敗，請稍後再試';
        errorMsg.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.textContent = '登入';
      }
    });
  </script>
  <script>
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadRules() {
      const el = document.getElementById('rulesContent');
      try {
        const res = await fetch('/api/summary');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        const s = data.settings || {};
        const today = data.today || '';

        const p1d = s.phase1_deadline || '';
        const payd = s.payment_deadline || '';
        const p2d = s.phase2_deadline || '';
        const guaranteed = s.guaranteed_quota || '10';
        const totalQuota = s.phase1_total_quota || '160';

        let phase = 'closed';
        if (p2d && today > p2d) phase = 'closed';
        else if (p1d && today > p1d) {
          if (payd && today <= payd) phase = 'phase1_closed';
          else phase = 'phase2';
        } else phase = 'phase1';

        const phaseLabel = {
          phase1: '第一階段報名中',
          phase1_closed: '第一階段已截止（待繳費）',
          phase2: '第二階段報名中',
          closed: '報名已截止'
        };
        const badgeColor = {
          phase1: '#5a8c5a',
          phase1_closed: '#c9944a',
          phase2: '#5c7cb8',
          closed: '#b85c4f'
        };

        el.innerHTML = `
          <div style="text-align:center; margin-bottom:20px;">
            <span style="display:inline-block; padding:6px 18px; border-radius:20px; font-size:14px; font-weight:600; color:#fff; background:${badgeColor[phase]};">${phaseLabel[phase]}</span>
          </div>
          <ul style="padding-left:20px; line-height:2; font-size:14px; color:#5a4636;">
            <li><strong>第一階段報名</strong>：即日起至 <strong>${esc(p1d) || '—'}</strong>；每社保障 ${esc(guaranteed)} 名，超過部分列為候補；總名額上限 ${esc(totalQuota)} 人。</li>
            <li><strong>繳費</strong>：請於 <strong>${esc(payd) || '—'}</strong> 前上傳繳費證明，未繳費視同未報名（自動棄權）。</li>
            <li><strong>第二階段報名</strong>：於 <strong>${esc(p2d) || '—'}</strong> 前，總名額未滿 ${esc(totalQuota)} 人時可繼續報名，超過列為候補。</li>
          </ul>`;
      } catch (err) {
        el.innerHTML = '<p style="color:#b5a898;">無法取得報名規則，請稍後再試。</p>';
      }
    }
    loadRules();
  </script>
  <script>
    window.GUIDE_PAGE = 'login';
    window.GUIDE_STEPS = [
      { target: '#clubId', title: '輸入社號', text: '帳號為您的社號（如 0001），管理員請輸入 admin。' },
      { target: '#password', title: '輸入密碼', text: '社團密碼預設為「社號」，管理員使用管理密碼登入。' },
      { target: '#loginBtn', title: '點擊登入', text: '按下「登入」後，就會進入報名頁面開始填寫報名。', placement: 'top' },
      { target: '.nav a[href="/summary"]', title: '查看統計', text: '尚未登入也能到「目前報名統計」頁，隨時查看各社的報名狀況。' }
    ];
  </script>
  <script src="/js/guide.js"></script>
</body>
</html>
