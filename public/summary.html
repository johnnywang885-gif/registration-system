<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報名系統 - 目前報名統計</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>區會報名系統</h1>
      <p>各社報名統計（不含明細）</p>
    </div>

    <div class="nav">
      <a href="/">登入</a>
      <a href="/summary" class="active">目前報名統計</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3 id="totalClubs">-</h3>
        <p>總社數</p>
      </div>
      <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <h3 id="totalRegistered">-</h3>
        <p id="totalRegisteredLabel">第一階段總報名</p>
      </div>
      <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
        <h3 id="totalPhase2">-</h3>
        <p>第二階段總報名</p>
      </div>
    </div>

    <div class="card">
      <h2 class="mb-20">各社報名人數</h2>
      <div class="loading hidden" id="loading">
        <div class="spinner"></div>
        <p>載入中...</p>
      </div>
      <table id="summaryTable">
        <thead>
          <tr>
            <th>社號</th>
            <th>社名</th>
            <th>第一階段</th>
            <th>第二階段</th>
            <th>最後登錄時間</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    async function loadSummary() {
      document.getElementById('loading').classList.remove('hidden');
      try {
        const res = await fetch('/api/summary');
        const data = await res.json();

        document.getElementById('totalClubs').textContent = data.summary.length;

        const today = data.today;
        const paymentDeadline = data.settings.payment_deadline;
        const afterPayment = !!paymentDeadline && today > paymentDeadline;
        if (afterPayment) {
          document.getElementById('totalRegistered').textContent = data.phase1PaidTotal;
          document.getElementById('totalRegisteredLabel').textContent = '第一階段已繳費';
        } else {
          document.getElementById('totalRegistered').textContent = data.phase1Total;
          document.getElementById('totalRegisteredLabel').textContent = '第一階段總報名';
        }
        document.getElementById('totalPhase2').textContent = data.phase2Total;

        const tbody = document.getElementById('summaryBody');
        if (data.summary.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="padding: 20px; color: #999;">尚無報名資料</td></tr>';
        } else {
        tbody.innerHTML = data.summary.map(s => `
            <tr>
              <td>${s.club_id}</td>
              <td>${esc(s.club_name)}</td>
              <td>${afterPayment
                ? `<strong>${s.phase1_paid}</strong> <span style="font-size:12px; color:#8d7b6b;">(已完成報名並繳費${s.phase1_paid}人)</span>`
                : `<strong>${s.phase1_total}</strong> <span style="font-size:12px; color:#8d7b6b;">(保障${s.phase1_registered}/候補${s.phase1_standby})</span>`}</td>
              <td><strong>${s.phase2_count}</strong></td>
              <td>${s.last_register_time ? new Date(s.last_register_time + 'Z').toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }) : '-'}</td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('載入失敗:', err);
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    loadSummary();

    const summaryInterval = setInterval(loadSummary, 30000);
    window.addEventListener('beforeunload', () => clearInterval(summaryInterval));
  </script>
  <script>
    window.GUIDE_PAGE = 'summary';
    window.GUIDE_STEPS = [
      { target: '#totalRegistered', title: '第一階段總報名人數', text: '第一階段截止前顯示「總報名人數」；繳費截止後會自動切換為「已繳費人數」。' },
      { target: '#totalPhase2', title: '第二階段總報名人數', text: '第一階段截止後開放的第二階段報名人數。' },
      { target: '#summaryTable', title: '各社報名人數一覽', text: '表格列出各社第一、二階段的報名人數，以及保障名額與候補情形。' }
    ];
  </script>
  <script src="/js/guide.js"></script>
</body>
</html>
