<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報名系統 - 報名頁</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .reg-form-card {
      max-width: 680px;
      margin: 0 auto 20px;
    }
    .reg-form-card .form-group input,
    .reg-form-card .form-group select {
      font-size: 15px;
      padding: 12px 14px;
    }
    .reg-form-card .form-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e8ddd2;
    }
    .reg-form-card .form-section-title {
      font-size: 12px;
      font-weight: 600;
      color: #b5a898;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .reg-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .reg-list-header h2 {
      font-size: 18px;
      color: #4a3728;
    }
    .reg-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .reg-card {
      background: #fff;
      border: 1px solid #e8ddd2;
      border-radius: 10px;
      padding: 18px 20px;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      cursor: default;
    }
    .reg-card:hover {
      box-shadow: 0 4px 16px rgba(139, 109, 77, 0.12);
      transform: translateY(-1px);
    }
    .reg-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .reg-card-name {
      font-size: 16px;
      font-weight: 600;
      color: #4a3728;
    }
    .reg-card-position {
      font-size: 13px;
      color: #8d7b6b;
      margin-top: 2px;
    }
    .reg-card-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 14px;
    }
    .reg-card-field {
      font-size: 13px;
      color: #8d7b6b;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .reg-card-field strong {
      color: #7d6b5d;
      font-weight: 500;
    }
    .reg-card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #f0e8df;
    }
    .reg-card-phase {
      font-size: 12px;
      color: #b5a898;
      background: #f5f0eb;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .reg-empty {
      text-align: center;
      padding: 48px 20px;
      color: #b5a898;
    }
    .reg-empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    .reg-empty p {
      font-size: 14px;
    }
    .btn-loading {
      position: relative;
      pointer-events: none;
    }
    .btn-loading::after {
      content: '';
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 6px;
      vertical-align: middle;
    }
    @media (max-width: 768px) {
      .reg-card-top {
        flex-direction: column;
        gap: 4px;
      }
      .reg-card-details {
        gap: 4px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>區會報名系統</h1>
      <p id="clubInfo">載入中...</p>
    </div>

    <div class="nav">
      <a href="/" id="navLogout" onclick="localStorage.clear()">登出</a>
      <a href="/register" class="active">報名</a>
      <a href="/payment">繳費證明</a>
      <a href="/summary">目前報名統計</a>
    </div>

    <div class="card reg-form-card">
      <h2 class="mb-20" style="font-size:18px; color:#4a3728;">報名表單</h2>
      <div id="alertBox" class="hidden"></div>
      <div class="reg-form-card form-section-title">基本資料</div>
      <form id="regForm">
        <div class="form-row">
          <div class="form-group">
            <label>職稱</label>
            <select id="position">
              <option value="">請選擇</option>
              <option value="理事">理事</option>
              <option value="監事">監事</option>
              <option value="聘任幹部">聘任幹部</option>
              <option value="眷屬">眷屬</option>
            </select>
          </div>
          <div class="form-group">
            <label>姓名 *</label>
            <input type="text" id="name" placeholder="必填" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>身分證</label>
            <input type="text" id="idCard" placeholder="身分證字號">
          </div>
          <div class="form-group">
            <label>生日</label>
            <input type="date" id="birthday">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>手機</label>
            <input type="tel" id="phone" placeholder="手機號碼">
          </div>
          <div class="form-group">
            <label>素/葷</label>
            <select id="mealType">
              <option value="">請選擇</option>
              <option value="葷">葷食</option>
              <option value="素">素食</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">新增報名</button>
          <button type="button" class="btn btn-secondary hidden" id="cancelBtn" onclick="cancelEdit()">取消編輯</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="reg-list-header">
        <h2>本社報名名單</h2>
        <span id="countBadge" class="badge badge-registered">已報名 0 人</span>
      </div>
      <div class="loading hidden" id="loadingList">
        <div class="spinner"></div>
        <p>載入中...</p>
      </div>
      <div id="regList"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';

    let editingId = null;
    let regList = [];

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function showAlert(msg, type = 'success') {
      const box = document.getElementById('alertBox');
      box.className = `alert alert-${type}`;
      box.textContent = msg;
      box.classList.remove('hidden');
      box.style.opacity = '0';
      box.style.transform = 'translateY(-8px)';
      requestAnimationFrame(() => {
        box.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        box.style.opacity = '1';
        box.style.transform = 'translateY(0)';
      });
      setTimeout(() => {
        box.style.opacity = '0';
        box.style.transform = 'translateY(-8px)';
        setTimeout(() => box.classList.add('hidden'), 300);
      }, 3000);
    }

    function statusBadge(status) {
      const map = { registered: '已報名', paid: '已繳費', forfeited: '棄權', standby: '候補' };
      return `<span class="badge badge-${status}">${map[status] || status}</span>`;
    }

    function renderRegCard(r) {
      const editable = r.status === 'registered' || r.status === 'standby';
      return `
        <div class="reg-card">
          <div class="reg-card-top">
            <div>
              <div class="reg-card-name">${esc(r.name)}</div>
              ${r.position ? `<div class="reg-card-position">${esc(r.position)}</div>` : ''}
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
              <span class="reg-card-phase">第${r.phase}階段</span>
              ${statusBadge(r.status)}
            </div>
          </div>
          <div class="reg-card-details">
            ${r.id_card ? `<span class="reg-card-field"><strong>身分證</strong> ${esc(r.id_card)}</span>` : ''}
            ${r.birthday ? `<span class="reg-card-field"><strong>生日</strong> ${esc(r.birthday)}</span>` : ''}
            ${r.phone ? `<span class="reg-card-field"><strong>手機</strong> ${esc(r.phone)}</span>` : ''}
            ${r.meal_type ? `<span class="reg-card-field"><strong>餐別</strong> ${esc(r.meal_type)}</span>` : ''}
          </div>
          ${editable ? `
          <div class="reg-card-actions">
            <button class="btn btn-sm btn-warning" onclick="editReg(${r.id})">編輯</button>
            <button class="btn btn-sm btn-danger" onclick="deleteReg(${r.id})">刪除</button>
          </div>` : ''}
        </div>`;
    }

    async function loadRegistrations() {
      document.getElementById('loadingList').classList.remove('hidden');
      try {
        const res = await fetch('/api/my-registrations', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { localStorage.clear(); window.location.href = '/'; return; }
        const data = await res.json();
        regList = data.registrations || [];

        document.getElementById('clubInfo').textContent =
          `${data.club.club_name} (${data.club.club_id}) | 已報名 ${data.count} 人`;
        document.getElementById('countBadge').textContent = `已報名 ${data.count} 人`;

        const list = document.getElementById('regList');
        if (data.registrations.length === 0) {
          list.innerHTML = `
            <div class="reg-empty">
              <div class="reg-empty-icon" role="img" aria-label="報名表">📋</div>
              <p>尚無報名資料</p>
            </div>`;
        } else {
          list.innerHTML = `<div class="reg-cards">${data.registrations.map(renderRegCard).join('')}</div>`;
        }
      } catch (err) {
        showAlert('載入失敗: ' + err.message, 'error');
      } finally {
        document.getElementById('loadingList').classList.add('hidden');
      }
    }

    function editReg(id) {
      const reg = regList.find(r => r.id === id);
      if (!reg) return;
      editingId = reg.id;
      document.getElementById('position').value = reg.position || '';
      document.getElementById('name').value = reg.name;
      document.getElementById('idCard').value = reg.id_card || '';
      document.getElementById('birthday').value = reg.birthday || '';
      document.getElementById('phone').value = reg.phone || '';
      document.getElementById('mealType').value = reg.meal_type || '';
      document.getElementById('submitBtn').textContent = '更新報名';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('regForm').reset();
      document.getElementById('submitBtn').textContent = '新增報名';
      document.getElementById('submitBtn').classList.remove('btn-loading');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const body = {
        position: document.getElementById('position').value,
        name: document.getElementById('name').value,
        id_card: document.getElementById('idCard').value,
        birthday: document.getElementById('birthday').value,
        phone: document.getElementById('phone').value,
        meal_type: document.getElementById('mealType').value
      };

      btn.disabled = true;
      btn.classList.add('btn-loading');

      try {
        const url = editingId ? `/api/registrations/${editingId}` : '/api/registrations';
        const method = editingId ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (!res.ok) { showAlert(data.error, 'error'); return; }

        showAlert(editingId ? '更新成功' : (data.message || '報名成功'));
        cancelEdit();
        loadRegistrations();
      } catch (err) {
        showAlert('操作失敗: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
      }
    });

    async function deleteReg(id) {
      if (!confirm('確定要刪除此筆報名？')) return;
      try {
        const res = await fetch(`/api/registrations/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) { showAlert(data.error, 'error'); return; }
        showAlert('刪除成功');
        loadRegistrations();
      } catch (err) {
        showAlert('刪除失敗: ' + err.message, 'error');
      }
    }

    loadRegistrations();
  </script>
</body>
</html>
